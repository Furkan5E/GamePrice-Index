[project]
name = "gameprice-index"
version = "0.1.0"
description = "ETL pipeline that scrapes, stores and analyses video game prices across storefronts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "selenium>=4.47.0",
]

[project.scripts]
gameprice-index = "gameprice_index.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pandas-stubs>=2.3",
    "pytest>=9.1.1",
    "ruff>=0.12",
    "types-beautifulsoup4>=4.12",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gameprice_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "selenium.*"]
ignore_missing_imports = true
