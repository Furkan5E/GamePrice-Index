[project]
name = "gameprice-index"
version = "0.1.0"
description = "ETL pipeline that scrapes, stores and analyses video game prices across storefronts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pandera[pandas]>=0.26",
    "rapidfuzz>=3.13",
    "requests>=2.34.2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
dashboard = [
    "streamlit>=1.50",
]

[project.scripts]
gameprice-index = "gameprice_index.cli:main"

[dependency-groups]
dev = [
    "httpx2>=1.0",
    "mypy>=1.18",
    "pandas-stubs>=2.3",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "types-beautifulsoup4>=4.12",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gameprice_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["gameprice_index"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
