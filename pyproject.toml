[project]
name = "gameprice-index"
version = "0.1.0"
description = "ETL pipeline that scrapes, stores and analyses video game prices across storefronts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "selenium>=4.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gameprice_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
