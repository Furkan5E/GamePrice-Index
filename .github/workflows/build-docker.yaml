name: Build Docker

on:
  # publish only after the test suite has passed on main
  workflow_run:
    workflows: [ "Test Suite" ]
    types: [ completed ]
    branches: [ "main" ]
  # pull requests get a build-only check, releases a versioned image
  pull_request:
    branches: [ "main" ]
  push:
    tags: [ "v*" ]

env:
  IMAGE: ghcr.io/furkan5e/gameprice-index

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Work out image tags
        id: tags
        run: |
          sha="$(git rev-parse --short HEAD)"
          tags="${IMAGE}:sha-${sha}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME#v}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
